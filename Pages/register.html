<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Create account | Smart Road Hazard Detection</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2939;
      --muted: #667085;
      --blue: #2864dc;
      --blue-dark: #1f50b5;
      --border: #e4e9f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 50% 0, #eaf1ff 0, transparent 38%),
        #f5f7fb;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .register-page {
      width: min(100%, 420px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-bottom: 27px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: left;
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 13px;
      background: var(--blue);
      color: #fff;
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
    }

    .brand-name {
      max-width: 190px;
      line-height: 1.25;
    }

    .card {
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(32, 54, 91, 0.08);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 9px 0 27px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 650;
    }

    .field input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field input::placeholder {
      color: #98a2b3;
    }

    .field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(40, 100, 220, 0.12);
    }

    .button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      background: var(--blue-dark);
    }

    .button:focus-visible,
    .link:focus-visible,
    .brand:focus-visible {
      outline: 3px solid rgba(40, 100, 220, 0.35);
      outline-offset: 3px;
    }

    .account-prompt {
      margin: 21px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .link {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }

    .link:hover {
      color: var(--blue-dark);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer {
      margin: 20px 0 0;
      color: #8993a3;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
      }

      .brand {
        margin-bottom: 21px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="register-page">
    <a class="brand" href="#" aria-label="Smart Road Hazard Detection home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="m8 21 2.2-18M16 21 13.8 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 5v3m0 4v3m0 4v1" stroke="#f8d75b" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">Smart Road Hazard Detection</span>
    </a>

    <section class="card" aria-labelledby="register-title">
      <p class="eyebrow">Road safety monitoring</p>
      <h1 id="register-title">Create your account</h1>
      <p class="subtitle">Enter your details to get started.</p>

      <form action="/register" method="POST">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Choose a username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Your full name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@organization.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" placeholder="Your phone number" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" type="text" placeholder="Your city" autocomplete="address-level2" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required>
        </div>

        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" placeholder="Enter your password again" autocomplete="new-password" required>
        </div>

        <button class="button" type="submit">Create account</button>
      </form>

      <p class="account-prompt">Already have an account? <a class="link" href="/Pages/login.html">Sign in</a></p>
    </section>

    <p class="footer">Smart Road Hazard Detection &middot; Safer journeys start here</p>
  </main>
</body>
</html>
